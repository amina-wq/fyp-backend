[tool.ruff]
line-length = 120
target-version = 'py312'

[tool.ruff.lint]
select = [
    'B', # bugbear
    'C4', # flake8-comprehensions
    'C90', # nccabe (complexity)
    'E', # pycodestyle (Error)
    'F',  # Pyflakes
    'I',  # isort
    'INP',  # flake8-no-pep420 (implicit-namespace-package)
    'ISC',  # flake8-implicit-str-concat
    'PGH',  # pygrep-hooks
    'PIE',  # flake8-pie
    'PL',  # Pylint
    'Q', # Pyquotes
    'RUF', # Ruff-specific rules
    'SIM',  # flake8-simplify
    'T10',  # flake8-debugger
    'TID',  # flake8-tidy-imports
    'UP',  # pyupgrade
    'W',  # pycodestyle (Warning)
]
ignore = [
    'B008', # Do not perform function call ... in argument defaults; instead, perform the call within the function,
            # or read the default from a module-level singleton variable
    'B904',  # Within an except clause, raise exceptions with raise ... from err or raise ... from None
             # to distinguish them from errors in exception handling. See the exception chaining tutorial for details.

    'RUF001',  # String contains ambiguous
    'RUF002',  # Docstring contains ambiguous
    'RUF003',  # Comment contains ambiguous

    'PLR0913', # Too many arguments in function definition
    'UP042', # Class inherits from both `str` and `enum.Enum`
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'
docstring-quotes = 'double'

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
case-sensitive = true
order-by-type = false

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["app"]
filterwarnings = [
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]

