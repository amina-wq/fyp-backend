services:
  fyp-backend:
    build: ./app
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://${FASTAPI_HOST}:${FASTAPI_PORT}/api/health > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  notification-worker:
    build: ./app
    restart: always
    env_file:
      - .env
    entrypoint: [ "sh", "worker_entrypoint.sh" ]
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      mongodb:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: fyp-mongodb
    restart: always
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME}
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: fyp-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: