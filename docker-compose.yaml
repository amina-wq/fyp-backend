services:
  fyp-backend:
    build: ./app
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: fyp-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fyp_user
      MONGO_INITDB_ROOT_PASSWORD: fyp_password
      MONGO_INITDB_DATABASE: $MONGODB_DB_NAME
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: