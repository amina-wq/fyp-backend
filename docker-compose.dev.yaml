services:
  fyp-backend:
    extends:
      file: docker-compose.yaml
      service: fyp-backend
    ports:
      - "80:80"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  mongodb:
    extends:
      file: docker-compose.yaml
      service: mongodb
    ports:
      - "27017:27017"

  redis:
    extends:
      file: docker-compose.yaml
      service: redis
    ports:
      - "6379:6379"

volumes:
  mongodb_data: