services:
  fyp-backend:
    extends:
      file: docker-compose.yaml
      service: fyp-backend

  notification-worker:
    extends:
      file: docker-compose.yaml
      service: notification-worker

  mongodb:
    extends:
      file: docker-compose.yaml
      service: mongodb
    ports:
      - "27017:27017"

  redis:
    extends:
      file: docker-compose.yaml
      service: redis
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
  redis_data: